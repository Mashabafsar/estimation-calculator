services:
  estimation-db:
    image: postgres:16-alpine
    container_name: estimation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estimation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimation}
      POSTGRES_DB: ${POSTGRES_DB:-estimation}
    ports:
      - "5434:5432"
    volumes:
      - estimation_pgdata:/var/lib/postgresql/data
    networks:
      estimation:
        aliases:
          - postgres
          - estimation-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: estimation-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Must use Docker service DNS name, not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-estimation}:${POSTGRES_PASSWORD:-estimation}@estimation-db:5432/${POSTGRES_DB:-estimation}?schema=public
      API_PORT: "4001"
      API_HOST: "0.0.0.0"
    ports:
      - "4001:4001"
    networks:
      - estimation
    depends_on:
      estimation-db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: estimation-web
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - estimation
    depends_on:
      - api

networks:
  estimation:
    name: estimation-net
    driver: bridge

volumes:
  estimation_pgdata:
